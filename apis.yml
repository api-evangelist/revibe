aid: revibe
name: Revibe
description: >-
  Revibe (Revibe Technology FZ-LLC) is a UAE-based e-commerce marketplace for certified
  refurbished and renewed electronics — iPhones, Samsung phones, MacBooks, laptops, iPads,
  TVs, and accessories — sold with a 12-month warranty, a 10-day return window, free UAE
  delivery, and buy-now-pay-later options (Tabby, Tamara, Split). Every device passes a
  50-point quality check and the company reports accepting only one in four supplier lots.
  Revibe operates in the UAE (revibe.me), Saudi Arabia (sa.revibe.me), and South Africa
  (revibe.co.za), and runs a trade-in program (sell.revibe.me). The storefront is built on
  Shopify and natively implements the Universal Commerce Protocol (UCP, ucp.dev), exposing a
  hosted MCP endpoint for agent-driven catalog search, cart, and human-approved checkout, plus
  a published /llms.txt and Shopify Customer Account OpenID Connect discovery. Backed by Partech.
